<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード演出デモ</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", sans-serif;
    background: linear-gradient(180deg, #d9fbe9 0%, #d8f2ff 55%, #cfeeff 100%);
    height: 100vh; overflow: hidden; position: relative;
  }
  .fake-head {
    height: 56px; background: rgba(255,255,255,.75);
    display: flex; align-items: center; padding: 0 16px;
    font-weight: 800; color: #14549e; font-size: 18px;
  }
  /* ---- 到着ポップアップ（実物と同じ部品） ---- */
  .gn {
    position: absolute; top: 76px; right: 10px; width: min(86vw, 340px);
    background: rgba(255,255,255,.92); border-radius: 18px;
    box-shadow: 0 10px 28px rgba(20,84,158,.22);
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  }
  .gn .ava { width: 44px; height: 44px; border-radius: 12px; background: #ffeef5; display: grid; place-items: center; font-size: 26px; flex: 0 0 auto; }
  .gn .tx { flex: 1 1 auto; min-width: 0; }
  .gn .t1 { font-weight: 800; font-size: 14.5px; color: #173a55; }
  .gn .t2 { font-size: 12.5px; color: #5a7a94; font-weight: 700; }
  .gn .art { width: 44px; height: 44px; object-fit: contain; flex: 0 0 auto; }
  /* ---- 小エフェクト：ポップアップ周りのキラキラ ---- */
  .spark {
    position: absolute; width: 16px; height: 16px; pointer-events: none;
    background: #ffc93c;
    clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
    opacity: 0; animation: burst 1.5s ease-out forwards;
  }
  @keyframes burst {
    0% { opacity: 0; transform: translate(0,0) scale(.3) rotate(0deg); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(140deg); }
  }
  .gn.glow { animation: glowp 1.5s ease-out; }
  @keyframes glowp {
    0% { box-shadow: 0 0 0 0 rgba(255,201,60,.0), 0 10px 28px rgba(20,84,158,.22); }
    25% { box-shadow: 0 0 0 6px rgba(255,201,60,.45), 0 10px 28px rgba(20,84,158,.22); }
    100% { box-shadow: 0 0 0 0 rgba(255,201,60,0), 0 10px 28px rgba(20,84,158,.22); }
  }
  /* ---- 全画面エフェクト ---- */
  .fullfx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .fullfx .dim { position: absolute; inset: 0; background: rgba(16,42,80,.38); animation: dimf 3.2s ease forwards; opacity: 0; }
  @keyframes dimf { 0% {opacity: 0;} 10% {opacity: 1;} 68% {opacity: 1;} 100% {opacity: 0;} }
  .fullfx .rays-wrap {
    position: absolute; left: 50%; top: 44%; width: 150vmax; height: 150vmax;
    transform: translate(-50%,-50%);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    animation: spin 7s linear infinite, dimf 3.2s ease forwards; opacity: 0;
  }
  .fullfx .rays {
    position: absolute; inset: 0;
  }
  .fullfx .rays.a {
    background: repeating-conic-gradient(from 0deg, rgba(255,214,90,.38) 0deg 9deg, rgba(255,214,90,0) 9deg 18deg);
    animation: swapA .56s steps(1) infinite;
  }
  .fullfx .rays.b {
    background: repeating-conic-gradient(from 9deg, rgba(140,220,255,.34) 0deg 9deg, rgba(140,220,255,0) 9deg 18deg);
    animation: swapB .56s steps(1) infinite;
  }
  @keyframes swapA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes swapB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(24deg); } }
  .fullfx .big {
    position: absolute; left: 50%; top: 44%; width: 190px; height: 190px; object-fit: contain;
    transform: translate(-50%,-50%) scale(.2); opacity: 0;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,.35));
    animation: pop 3.2s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-8deg); }
    16% { opacity: 1; transform: translate(-50%,-50%) scale(1.12) rotate(2deg); }
    26% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    68% { opacity: 1; transform: translate(-50%,-54%) scale(1.02); }
    100% { opacity: 0; transform: translate(-50%,-58%) scale(1.03); }
  }
  .fullfx .cap {
    position: absolute; left: 0; right: 0; top: calc(44% + 118px); text-align: center;
    color: #fff; font-weight: 800; font-size: 19px; text-shadow: 0 2px 10px rgba(0,0,0,.45);
    opacity: 0; animation: dimf 3.2s ease forwards;
  }
  .fall {
    position: absolute; top: -24px; width: 13px; height: 13px; pointer-events: none;
    background: #ffd75e;
    clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
    animation: fall linear forwards; opacity: 0;
  }
  @keyframes fall {
    0% { opacity: 0; transform: translateY(0) rotate(0deg); }
    10% { opacity: 1; }
    92% { opacity: 1; }
    100% { opacity: 0; transform: translateY(105vh) rotate(320deg); }
  }
</style>
</head>
<body>
  <div class="fake-head">ことば人狼</div>
  <div class="gn" id="gn">
    <div class="ava">🦉</div>
    <div class="tx">
      <div class="t1">けんさんから</div>
      <div class="t2" id="gn-text">王冠が届きました</div>
    </div>
    <img class="art" id="gn-art" src="gifts/gift-crown.webp" alt="">
  </div>
  <div class="fullfx" id="fullfx"></div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') ?? 'small';
  const gn = document.getElementById('gn');
  function sparks(host, n, spread) {
    for (let i = 0; i < n; i++) {
      const sp = document.createElement('i');
      sp.className = 'spark';
      const ang = (i / n) * Math.PI * 2 + Math.random() * 0.5;
      const dist = spread * (0.6 + Math.random() * 0.7);
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      sp.style.left = (15 + Math.random() * 70) + '%';
      sp.style.top = (10 + Math.random() * 70) + '%';
      sp.style.animationDelay = (Math.random() * 0.25) + 's';
      sp.style.background = ['#ffc93c', '#ff9d5c', '#7cc7f5'][i % 3];
      host.appendChild(sp);
    }
  }
  function playFx() {
    gn.querySelectorAll('.spark').forEach((e) => e.remove());
    gn.classList.remove('glow');
    void gn.offsetWidth;
    if (mode === 'small') {
      gn.classList.add('glow');
      gn.style.overflow = 'visible';
      sparks(gn, 14, 62);
      return;
    }
    document.getElementById('gn-text').textContent = 'ダイヤモンドが届きました';
    document.getElementById('gn-art').src = 'gifts/gift-diamond.webp';
    const fx = document.getElementById('fullfx');
    fx.innerHTML = '<div class="dim"></div><div class="rays-wrap"><div class="rays a"></div><div class="rays b"></div></div>' +
      '<img class="big" src="gifts/gift-diamond-fx.webp" alt="">' +
      '<div class="cap">けんさんから ダイヤモンド！</div>';
    for (let i = 0; i < 22; i++) {
      const f = document.createElement('i');
      f.className = 'fall';
      f.style.left = Math.random() * 100 + '%';
      f.style.animationDuration = (1.5 + Math.random() * 1.1) + 's';
      f.style.animationDelay = (Math.random() * 0.7) + 's';
      f.style.background = ['#ffd75e', '#9adcff', '#fff'][i % 3];
      fx.appendChild(f);
    }
  }
  playFx();
  setInterval(playFx, 4200);
</script>
</body>
</html>
